services:
  - name: bijlisaver-api
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./BijliSaver.Api/Dockerfile
    dockerContext: ./BijliSaver.Api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: bijlisaver
      - key: OcrService__BaseUrl
        value: https://bijlisaver-ocr.onrender.com
      - key: AllowedOrigins__0
        value: https://bijlisaver-web.onrender.com

  - name: bijlisaver-ocr
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./ocr-service/bijlisaver-ocr/Dockerfile
    dockerContext: ./ocr-service/bijlisaver-ocr
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OCR_MODEL
        value: gemini-2.5-flash-lite

  - name: bijlisaver-web
    type: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: ./bijlisaver-web
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bijlisaver-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
